<!DOCTYPE html>
<html lang="es-CO">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2A2D33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rodizio">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Rodizio · Acceso</title>
  <meta name="author" content="ParaTouch — DJG (djgv · Mxi)" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="shared/marca.css">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="shared/ui.css">
  <link rel="stylesheet" href="shared/pwa.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrap" id="app">
    <div class="logo"><img src="icons/logo-blanco.webp" alt="Rodízio" height="32"></div>
    <h1 class="title">Rodizio</h1>
    <p class="sub" id="subTxt">Cúcuta · Sistema interno</p>

    <div id="vistaCargando" class="cargando hidden">
      <div class="spinner"></div>
      <p class="cargando-texto">Verificando sesión…</p>
    </div>

    <form id="formLogin">
      <div class="field"><input id="fUsuario" placeholder="Usuario" autocomplete="username"></div>
      <div class="field"><input id="fPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
      </div>
      <button class="cta" id="btnEntrar" type="submit">Entrar</button>
      <p class="err hidden" id="errLogin"></p>
    </form>
    <div id="vistaRoles" class="hidden">
      <h2 class="roles-title" id="bienvenida">Bienvenido</h2>
      <p class="roles-sub">Selecciona con qué función vas a entrar</p>
      <div id="listaRoles"></div>
      <button class="logout-link" id="btnCancelar">Cancelar y salir</button>
    </div>
  </div>

  <script type="module" src="shared/firebase.js"></script>
  <script src="shared/util.js"></script>
  <script src="shared/roles.js"></script>
  <script type="module" src="shared/auth.js"></script>
  <script src="app.js"></script>
  <p class="dev-credit">Desarrollado por <strong>ParaTouch</strong></p>
</body>

</html>
